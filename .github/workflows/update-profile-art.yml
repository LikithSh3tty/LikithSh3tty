name: Update profile art

"on":
  schedule:
    - cron: "17 6 * * *"   # ~06:17 UTC daily
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # requirements.txt is deliberately CI-only. The image libraries live in
      # requirements-art.txt because rembg alone pulls a ~180MB model, which has
      # no business in a daily cron — the portrait and card are committed art.
      - run: pip install -r scripts/requirements.txt
      # Both steps fail loudly rather than writing an empty calendar, so a
      # markup change on GitHub's side leaves the last good SVG committed.
      - run: python -m scripts.fetch_contributions
      - run: python -m scripts.render_heatmap_svg
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg"
